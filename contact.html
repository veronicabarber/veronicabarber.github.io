<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Veronica Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">  <link rel="stylesheet" href="css/style.css">
</head>
<body class="inner">

  <header class="site-header">
    <a class="brand" href="index.html">Veronica Barber</a>
    <nav class="nav-buttons" aria-label="Main navigation">
      <a href="about.html">About Me</a>
      <a href="cv.html">CV</a>
      <a href="substack.html">Substack</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact</h1>
    <p class="prose" style="color: var(--parchment-dim); margin-bottom: 2rem;">Leave a note and it will land directly in my inbox.</p>

    <form class="contact" id="contact-form" action="https://formspree.io/f/xnpdoqaj" method="POST">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div>
        <label for="message">Note</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <!-- Honeypot: real people never see this; bots fill it in -->
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div><button class="btn" type="submit">Submit</button></div>
      <div class="form-status" id="form-status" role="status"></div>
    </form>
  </main>

  <footer>© <span id="yr"></span> Veronica Barber</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Sending…';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.reset();
          status.textContent = 'Thank you. Your note has been sent.';
        } else {
          status.textContent = 'Something went wrong. Please try again.';
        }
      } catch (err) {
        status.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
